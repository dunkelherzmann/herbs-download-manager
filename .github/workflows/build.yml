# Off since 2026-11-09: the repo is private and GitHub charges for private repos' Actions minutes, so every pull
# request is checked on Herbert's own Mac, Linux and Windows machines with scripts/check.sh instead. It can still be
# run by hand (Actions ▸ Build ▸ Run workflow) if the minutes are ever free again.
name: Build
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: rustup target add aarch64-apple-darwin
      - run: macos/scripts/build.sh
      - run: scripts/test.sh
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
