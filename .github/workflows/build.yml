# Every pull request and every push to main, on GitHub's Mac, Linux and Windows runners. Back on 2026-11-10 when the
# repo went public (Actions minutes are free for public repos; it was off while private, when they cost money).
# scripts/check.sh still checks a branch on Herbert's own three machines before merging.
name: Build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: rustup target add aarch64-apple-darwin
      - run: macos/scripts/build.sh
      - run: scripts/test.sh
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
