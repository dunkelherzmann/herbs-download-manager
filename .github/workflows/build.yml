# Builds and tests on GitHub's own runners for each pull request and push to main.
# Release builds are still made and installed on Herbert's own Mac, Linux and Windows machines.
name: Build
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: rustup target add aarch64-apple-darwin
      - run: macos/scripts/build.sh
      - run: scripts/test.sh
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
