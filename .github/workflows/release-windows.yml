# The Windows release files, built on GitHub's own Windows runner. scripts/release.sh starts it for the commit it
# releases, waits, and takes its files; the Mac, Linux and extension files still come from release.sh.
#   Herbs-Download-Manager-<version>-Windows-Setup.exe   the installer (Inno Setup), not code-signed
#   install-windows.ps1                                  installs it as administrator without SmartScreen's warning
#   Herbs-Download-Manager-<version>-Windows.zip         the same app and hdm.exe, to run without installing
# A tag pushed without the Windows files on its release (one made by hand) gets them built and attached; a release
# made by release.sh already has them, so the tag's run stops at once.
name: Windows release
run-name: Windows release ${{ inputs.request || github.ref_name }}
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      commit:
        description: Commit to build (the default is the branch's tip)
        required: false
      request:
        description: A name for the run, which release.sh uses to find it
        required: false
# Read-only by default: the build runs third-party code (cargo build scripts, Inno Setup from Chocolatey), so only
# the job that attaches files to a release can write.
permissions:
  contents: read
  actions: read
jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=true
          if [ "$GITHUB_EVENT_NAME" = push ] \
              && gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null \
                 | grep -q -- '-Windows-Setup\.exe$'; then
            echo "The release for $GITHUB_REF_NAME already has its Windows files."
            build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
  windows:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      # All history and origin/main, for the version number (scripts/version.sh, windows/scripts/build.ps1).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build the app and hdm.exe
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File windows\scripts\build.ps1 -NoDesktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content version.txt -Raw).Trim()
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Build the installer
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File windows\scripts\installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The zip holds a folder with both programs: hdm.exe must stay beside the app (the browser's native host).
      - name: Zip the app and check both files
        run: |
          $setup = "Herbs-Download-Manager-$env:VERSION-Windows-Setup.exe"
          $zip = "Herbs-Download-Manager-$env:VERSION-Windows.zip"
          New-Item -ItemType Directory -Force release, stage\'Herbs Download Manager' | Out-Null
          Copy-Item dist\HerbsDownloadManager.exe, dist\hdm.exe stage\'Herbs Download Manager'
          Compress-Archive -Path stage\'Herbs Download Manager' -DestinationPath release\$zip
          Copy-Item dist\$setup, windows\install-windows.ps1 release\
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile("$PWD\release\install-windows.ps1", [ref]$null, [ref]$errors)
          if ($errors) { throw "install-windows.ps1 doesn't parse: $errors" }
          Expand-Archive release\$zip check
          & 'check\Herbs Download Manager\HerbsDownloadManager.exe' --self-check | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($f in "release\$setup", 'check\Herbs Download Manager\HerbsDownloadManager.exe', 'check\Herbs Download Manager\hdm.exe') {
            # Inno Setup pads its installer's text fields with spaces.
            $info = (Get-Item $f).VersionInfo
            $name = "$($info.ProductName)".Trim()
            $version = "$($info.ProductVersion)".Trim()
            Write-Host "$f : $name $version"
            if ($name -ne "Herb's Download Manager" -or $version -ne $env:VERSION) {
              throw "$f says $name $version, not Herb's Download Manager $env:VERSION"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/
          if-no-files-found: error
  # A tag's release made without the Windows files (by hand) gets them, and their lines in SHA256SUMS.txt (replacing
  # any older lines for the same names).
  attach:
    needs: windows
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Attach to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || { echo "No release for $GITHUB_REF_NAME yet: the files are in this run's windows-release artifact."; exit 0; }
          cd release
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS.txt 2>/dev/null || : > SHA256SUMS.txt
          names="$(ls -- *-Windows-Setup.exe install-windows.ps1 *-Windows.zip)"
          grep -v -F -f <(printf '%s\n' $names | sed 's/^/  /') SHA256SUMS.txt > sums.tmp || :
          sha256sum -- $names >> sums.tmp
          mv sums.tmp SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" --clobber -- *-Windows-Setup.exe install-windows.ps1 *-Windows.zip SHA256SUMS.txt
