[package]
name = "hd-core"
description = "Herb's Download Manager engine: sources, segments, connections, mirrors, resume state and queue, with no UI."
version.workspace = true
edition.workspace = true
license.workspace = true

[dev-dependencies]
hd-mock = { path = "../tools/hd-mock" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[dependencies]
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
trash = "5.3.0"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSURL", "NSString", "NSDictionary", "NSValue", "NSArray", "NSError"] }
