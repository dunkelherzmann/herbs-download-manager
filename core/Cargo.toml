[package]
name = "hd-core"
description = "Herb's Downloader engine: sources, segments, connections, mirrors, resume state and queue, with no UI."
version.workspace = true
edition.workspace = true
license.workspace = true

[dev-dependencies]
hd-mock = { path = "../tools/hd-mock" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
