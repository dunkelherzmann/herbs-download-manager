# Herb's Download Manager for Windows: a Rust Win32 host over the shared core, one static portable .exe
# (SPECIFICATION.md §1). Its own workspace, so the root workspace (checked on all three machines) never needs Win32.
[workspace]

[package]
name = "herbs-download-manager-windows"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "HerbsDownloadManager"
path = "src/main.rs"

[[bin]]
name = "hdm"
path = "src/hdm.rs"

[dependencies]
hd-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
