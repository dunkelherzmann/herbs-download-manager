# Herb's Download Manager for Linux: a GTK 4 + libadwaita host over the shared core (SPECIFICATION.md §1).
# Its own workspace, so the root workspace (checked on all three machines) never needs GTK.
[workspace]

[package]
name = "herbs-download-manager-linux"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "herbs-download-manager"
path = "src/main.rs"

[[bin]]
name = "hdm"
path = "../core/src/bin/hdm.rs"

[dependencies]
hd-core = { path = "../core" }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7"] }
# A pasted page's player, run out of sight (§15): WebKitGTK 6, in the GNOME runtime.
webkit6 = "0.6.1"
# The status-area icon while the window is closed (§2): a StatusNotifierItem.
ksni = { version = "0.3.7", features = ["blocking"] }
# The YouTube bridge's messages (§15), as the core reads them.
serde_json = "1.0.154"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
