<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Herb's Download Manager</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="" width="20" height="20">
    <h1>Herb's Download Manager</h1>
  </header>
  <label class="switch">
    <input type="checkbox" id="on">
    <span>Take the browser's downloads</span>
  </label>
  <label class="switch" id="panel-row" hidden>
    <input type="checkbox" id="panel">
    <span>Open in the side panel</span>
  </label>
  <div class="heading">
    <h2>Played on this page</h2>
    <select id="order" aria-label="Order of the list" title="Order of the list: Smart puts streams first, finished ones before live ones and the page's own site before others">
      <option value="smart">Smart order</option>
      <option value="oldest">Oldest first</option>
      <option value="newest">Newest first</option>
    </select>
  </div>
  <ul id="items"></ul>
  <div id="empty" hidden>
    <p>Nothing found yet. Start the video (and skip any ads), and it shows here.</p>
    <button id="again" class="scan" title="Load the page again, so its player fetches its video again">Look Again</button>
  </div>
  <div class="actions">
    <button id="scan" class="scan">Find Files on This Page</button>
    <button id="rules" class="scan" title="How this site's videos are named and saved, and what a click in the list does">Naming Rules…</button>
  </div>
  <ul id="found"></ul>
  <p id="scan-note" class="note" hidden></p>
  <script src="popup.js"></script>
</body>
</html>
