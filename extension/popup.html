<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Herb's Download Manager</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="" width="20" height="20">
    <h1>Herb's Download Manager</h1>
  </header>
  <label class="switch">
    <input type="checkbox" id="on">
    <span>Take the browser's downloads</span>
  </label>
  <h2>On this page</h2>
  <ul id="items"></ul>
  <p id="empty" hidden>Nothing to download found yet. Play the video or sound, then look again.</p>
  <script src="popup.js"></script>
</body>
</html>
